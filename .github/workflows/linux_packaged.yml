name: Linux Packaged.

on:
  release:
    types: [published]

jobs:

  build:
    
    name: Build Linux Release Package
    runs-on: avrea-ubuntu-latest-8-vcpu
    permissions:
      contents: write
      packages: read

    env:
      PACKAGE_NAME: yurigram
      REPO_TAG: ${{ github.event.release.tag_name }}
      IMAGE_REPOSITORY: ghcr.io/telegramdesktop/tdesktop/centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: ${{ env.PACKAGE_NAME }}
          ref: ${{ env.REPO_TAG }}
          
      - name: Setup envs.
        run: |

          cd ${{ env.PACKAGE_NAME }}

          USERFLAGS=0:0
          if ! docker info -f "{{println .SecurityOptions}}" | grep rootless; then
            USERFLAGS=$(id -u):$(id -g)
          fi

          VERSION=$(grep 'AppVersionStr' Telegram/SourceFiles/core/version.h | cut -d '"' -f 2)

          echo USERFLAGS=$USERFLAGS >> $GITHUB_ENV
          echo ARCH="$(uname -m)" >> $GITHUB_ENV
          echo VERSION=$VERSION >> $GITHUB_ENV

      - name: Setup Docker Image.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          API_URL=https://api.github.com
          API_VERSION=2026-03-10
          RELEASE_TAG="v$VERSION"
          PACKAGE_NAME=tdesktop%2Fcentos_env

          request() {
            curl --fail-with-body --silent --show-error --location \
              --retry 3 \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: $API_VERSION" \
              "$1"
          }

          echo "Try to get docker image label of release $RELEASE_TAG..."

          RELEASE_DATE=$(request \
            "$API_URL/repos/telegramdesktop/tdesktop/releases/tags/$RELEASE_TAG" \
            | jq -er '.published_at')
          IMAGE_CUTOFF_DATE=$(date -u \
            --date="$RELEASE_DATE + 4 hours" \
            '+%Y-%m-%dT%H:%M:%SZ')

          VERSIONS_FILE=$(mktemp)
          trap 'rm -f "$VERSIONS_FILE"' EXIT

          PAGE=1
          while true; do
            VERSIONS=$(request \
              "$API_URL/orgs/telegramdesktop/packages/container/$PACKAGE_NAME/versions?per_page=100&page=$PAGE")
            COUNT=$(jq 'length' <<< "$VERSIONS")
            jq -c '.[]' <<< "$VERSIONS" >> "$VERSIONS_FILE"

            if [ "$COUNT" -lt 100 ]; then
              break
            fi
            PAGE=$((PAGE + 1))
          done

          IMAGE_VERSION=$(jq -ser \
            --arg cutoff_date "$IMAGE_CUTOFF_DATE" \
            'map(select(.created_at < $cutoff_date)) | max_by(.created_at)' \
            "$VERSIONS_FILE")
          IMAGE_DIGEST=$(jq -er '.name | select(startswith("sha256:"))' \
            <<< "$IMAGE_VERSION")
          IMAGE_DATE=$(jq -r '.created_at' <<< "$IMAGE_VERSION")
          IMAGE_TAGS=$(jq -r \
            'if .metadata.container.tags | length > 0
             then .metadata.container.tags | join(", ")
             else "untagged"
             end' \
            <<< "$IMAGE_VERSION")
          IMAGE_TAG="$IMAGE_REPOSITORY@$IMAGE_DIGEST"

          echo "Release $RELEASE_TAG was published at $RELEASE_DATE"
          echo "Using image cutoff $IMAGE_CUTOFF_DATE (release + 4 hours)"
          echo "Using image $IMAGE_TAG from $IMAGE_DATE ($IMAGE_TAGS)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

          docker pull $IMAGE_TAG
          
      - name: Build.
        run: |

          docker run --rm \
            -u ${{ env.USERFLAGS }} \
            -v "$PWD/${{ env.PACKAGE_NAME }}:/usr/src/tdesktop" \
            -e CONFIG=${CONFIG:-Release} \
            ${{ env.IMAGE_TAG }} \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D DESKTOP_APP_USE_PANGO=OFF \
            -D TDESKTOP_API_ID=${{ secrets.API_ID }} \
            -D TDESKTOP_API_HASH=${{ secrets.API_HASH }}
          
      - name: Install.
        run: |

          docker run --rm \
            -u ${{ env.USERFLAGS }} \
            -v "$PWD/${{ env.PACKAGE_NAME }}:/usr/src/tdesktop" \
            -e CONFIG=${CONFIG:-Release} \
            -e DESTDIR="/usr/src/tdesktop" \
            -w /usr/src/tdesktop/Telegram \
            ${{ env.IMAGE_TAG }} \
            cmake --install /usr/src/tdesktop/out --config "${CONFIG:-Release}" --prefix /pkg/usr
          
          tar -czvf ${{ env.PACKAGE_NAME }}-${{ env.REPO_TAG }}-${{ env.ARCH }}.tar.gz -C ${{ env.PACKAGE_NAME }}/pkg .

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with: 
          name: ${{ env.PACKAGE_NAME }}-${{ env.REPO_TAG }}-${{ env.ARCH }}
          path: ${{ env.PACKAGE_NAME }}/pkg

      - name: Upload Release Package
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ github.event.release.id }}
          file: ${{ env.PACKAGE_NAME }}-${{ env.REPO_TAG }}-${{ env.ARCH }}.tar.gz
        
