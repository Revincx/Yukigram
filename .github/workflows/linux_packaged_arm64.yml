name: Linux Packaged ARM64.

on:
  release:
    types: [published]

env:
  PACKAGE_NAME: yurigram
  REPO_TAG: ${{ github.event.release.tag_name }}
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}/centos_env
  IMAGE_RECIPE_VERSION: v1

jobs:
  image:
    name: Get or Build ARM64 Docker Image
    strategy:
      matrix:
        runner:
          - avrea-ubuntu-latest-arm-8-vcpu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      BUILDX_CACHE_ENDPOINT: ${{ startsWith(matrix.runner, 'avrea-') && ',url_v2=https://cache.avrea.com/' || '' }}
    permissions:
      contents: read
      packages: write
    concurrency:
      group: linux-packaged-arm64-image
      cancel-in-progress: false
    outputs:
      image-ref: ${{ steps.image.outputs.image-ref }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REPO_TAG }}

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          swap-storage: false

      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v4

      - name: Get or prepare Docker image.
        id: image
        env:
          CONTEXT_HASH: ${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$CONTEXT_HASH" ]; then
            echo "Docker build context was not found."
            exit 1
          fi

          IMAGE_REPOSITORY="${IMAGE_REPOSITORY,,}"
          IMAGE_TAG="$IMAGE_REPOSITORY:arm64-$IMAGE_RECIPE_VERSION-$CONTEXT_HASH"
          echo "image-ref=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

          echo "$GH_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          INSPECT_LOG="$RUNNER_TEMP/arm64-image-inspect.log"
          if docker buildx imagetools inspect "$IMAGE_TAG" \
              >/dev/null 2>"$INSPECT_LOG"; then
            echo "Using existing image $IMAGE_TAG."
          elif grep -Eiq \
              'manifest unknown|no such manifest|not found' \
              "$INSPECT_LOG"; then
            export PATH="$HOME/.local/bin:$PATH"

            curl -sSL https://install.python-poetry.org | python3 -

            cd Telegram/build/docker/centos_env
            poetry install --no-interaction --no-ansi
            DEBUG= LTO= poetry run gen_dockerfile \
              > "$RUNNER_TEMP/centos-env-arm64.Dockerfile"
            echo "needs-build=true" >> "$GITHUB_OUTPUT"
          else
            cat "$INSPECT_LOG" >&2
            exit 1
          fi

      - name: Build and push Docker image.
        if: steps.image.outputs.needs-build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          file: ${{ runner.temp }}/centos-env-arm64.Dockerfile
          platforms: linux/arm64
          tags: ${{ steps.image.outputs.image-ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha${{ env.BUILDX_CACHE_ENDPOINT }},scope=centos-env-arm64
          cache-to: type=gha${{ env.BUILDX_CACHE_ENDPOINT }},mode=max,scope=centos-env-arm64
          push: true

      - name: Verify Docker image.
        env:
          IMAGE_REF: ${{ steps.image.outputs.image-ref }}
        run: docker buildx imagetools inspect "$IMAGE_REF" >/dev/null

  build:
    name: Build Linux ARM64 Release Package
    needs: image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
      packages: read

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.PACKAGE_NAME }}
          ref: ${{ env.REPO_TAG }}

      - name: Free up disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          swap-storage: false

      - name: Build and package.
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.image.outputs.image-ref }}
        run: |
          set -euo pipefail

          echo "$GH_TOKEN" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE_REF"

          IMAGE_ARCH=$(docker image inspect "$IMAGE_REF" \
            --format '{{.Architecture}}')
          if [ "$IMAGE_ARCH" != "arm64" ]; then
            echo "Expected an arm64 image, got $IMAGE_ARCH."
            exit 1
          fi

          USERFLAGS=0:0
          if ! docker info -f "{{println .SecurityOptions}}" \
              | grep -q rootless; then
            USERFLAGS=$(id -u):$(id -g)
          fi

          docker run --rm \
            -u "$USERFLAGS" \
            -v "$PWD/$PACKAGE_NAME:/usr/src/tdesktop" \
            -e CONFIG=Release \
            "$IMAGE_REF" \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D DESKTOP_APP_USE_PACKAGED=ON \
            -D TDESKTOP_API_ID="${{ secrets.API_ID }}" \
            -D TDESKTOP_API_HASH="${{ secrets.API_HASH }}"

          docker run --rm \
            -u "$USERFLAGS" \
            -v "$PWD/$PACKAGE_NAME:/usr/src/tdesktop" \
            -e CONFIG=Release \
            -e DESTDIR=/usr/src/tdesktop \
            -w /usr/src/tdesktop/Telegram \
            "$IMAGE_REF" \
            cmake --install /usr/src/tdesktop/out \
              --config Release \
              --prefix /pkg/usr

          ARCHIVE="$PACKAGE_NAME-$REPO_TAG-aarch64.tar.gz"
          tar -czf "$ARCHIVE" -C "$PACKAGE_NAME/pkg" .
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PACKAGE_NAME }}-${{ env.REPO_TAG }}-aarch64
          path: ${{ env.PACKAGE_NAME }}/pkg
          if-no-files-found: error

      - name: Upload release package.
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          release_id: ${{ github.event.release.id }}
          file: ${{ steps.build.outputs.archive }}
